[project]
name = "cropstudio-backend"
version = "0.1.0"
description = "CropStudio AI — Backend API & Worker"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & Config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Logging
    "structlog>=24.4.0",
    # HTTP client (for AI providers, future sprints)
    "httpx>=0.27.0",
    # Auth
    "pyjwt[crypto]>=2.9.0",
    # Utilities
    "python-multipart>=0.0.9",
    "Pillow>=10.4.0",
    "aiofiles>=24.1.0",
    # Storage
    "google-cloud-storage>=2.17.0",
    # Queue
    "google-cloud-tasks>=2.16.2",
    # OpenAI Integration
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "types-aiofiles>=24.1.0.20240626",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff ───
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "B008"]  # E501: line length handled by formatter; B008: FastAPI Depends()

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── mypy ───
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true
ignore_errors = true

# ─── Pytest ───
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
